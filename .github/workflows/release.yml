name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for a draft GitHub release (leave empty to only upload workflow artifacts)
        type: string
        default: ""

env:
  LLVM_VERSION: "22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
          - os: windows-latest
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          . .github/scripts/llvm-env.sh
          mkdir -p dist
          go build -tags="$GL3_BUILD_TAGS" -o dist/gl3 .
          if [ "$RUNNER_OS" = Linux ]; then deps="$(ldd dist/gl3)"; else deps="$(otool -L dist/gl3)"; fi
          echo "$deps"
          if echo "$deps" | grep -E 'libLLVM|libffi\.so|libzstd|homebrew'; then
            echo "::error::gl3 still links a non-system library"
            exit 1
          fi
          dist/gl3 build examples/hello_world.gl3 -o "$RUNNER_TEMP/hello"
          "$RUNNER_TEMP/hello"
          tar -czf "gl3-${{ matrix.name }}.tar.gz" -C dist gl3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          . .github/scripts/llvm-env.sh
          mkdir -p dist
          go build -tags="$GL3_BUILD_TAGS" -o dist/gl3.exe .
          ldd dist/gl3.exe
          if ldd dist/gl3.exe | grep -i ucrt64; then
            echo "::error::gl3.exe still links an MSYS2 DLL"
            exit 1
          fi
          dist/gl3.exe build examples/hello_world.gl3 -o "$RUNNER_TEMP/hello.exe"
          "$RUNNER_TEMP/hello.exe"
          (cd dist && zip "../gl3-${{ matrix.name }}.zip" gl3.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: gl3-${{ matrix.name }}
          path: gl3-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --draft --generate-notes
