name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: Open a tmate session if e2e fails
        type: boolean
        default: false

env:
  LLVM_VERSION: "22"

jobs:
  frontend:
    strategy: &matrix
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          # experimental gets removed per-OS once that OS passes.
          - os: ubuntu-24.04-arm
            experimental: true
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }} # removed per-OS once that OS passes
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./lexer/... ./parser/... ./sema/... ./hir/... ./util/...

  e2e:
    strategy: *matrix
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }} # removed per-OS once that OS passes
    env:
      CGO_ENABLED: "1"
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          . .github/scripts/llvm-env.sh
          go test -tags="$GL3_BUILD_TAGS" ./...
          go test -tags="$GL3_BUILD_TAGS" ./e2e -count=1

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          . .github/scripts/llvm-env.sh
          go test -tags="$GL3_BUILD_TAGS" ./...
          go test -tags="$GL3_BUILD_TAGS" ./e2e -count=1

      - name: Debug with tmate
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.debug
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
